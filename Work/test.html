<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <style>
        /* 1. 默认主题（白天模式）变量定义 */
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --card-bg: #f5f5f5;
        }

        /* 2. 暗黑模式变量覆盖（当 html 或 body 有 .dark 类时生效） */
        .dark {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --card-bg: #2d2d2d;
        }

        /* 3. 使用变量 */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s;
            /* 加上平滑过渡，切换时不刺眼 */
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
        }

        .btn {
            background: var(--text-color);
            color: var(--bg-color);
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <button class="btn" onclick="toggleTheme()">切换主题</button>
    <div class="card" style="margin-top: 20px;">
        <h2>你好，前端开发！</h2>
        <p>点击上面的按钮，看看主题是如何切换的。</p>
    </div>

    <script>
        // JS 逻辑：给 html 标签加上或移除 dark 类名
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }
    </script>
</body>

</html>
