<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>
</head>

<body>
    <header>欢迎来到自学课堂<br>注册一下吧</header>
    <form action="">
        <label for="avatar">头像：</label>
        <input type="file" id="avatar" value="avatar"><br>

        <label for="username">用户昵称：</label>
        <input type="text" id="username"><br>

        <label for="password">密码：</label>
        <input type="password" id="password"><br>

        <label>性别：</label>
        <label>
            <input type="radio" name="gender" value="secret" checked>保密
        </label>
        <label>
            <input type="radio" name="gender" value="male">男
        </label>
        <label>
            <input type="radio"  name="gender" value="female">女
        </label>
        <br>

        <label for="hobby">爱好：</label>
        <input type="checkbox"  name="reading" value="reading">
        <label for="reading">阅读</label>
        <input type="checkbox"  name="swimming" value="swimming">
        <label for="swimming">游泳</label>
        <input type="checkbox"  name="playing" value="playing">
        <label for="playing">玩游戏</label>

        <br>
        <label for="city">城市：</label>
        <select name="city" id="city">
            <option value="gz">广州</option>
            <option value="sz">深圳</option>
            <option value="zs">中山</option>
        </select>
        <br>

        <label for="info">个人简介：</label><br>
        <textarea name="info" id="info" cols="30" rows="3" placeholder="快来写点东西吧~"></textarea>
        <br>
        <button type="reset">取消</button>
        <button type="submit">提交</button>

    </form>



















</body>

</html>
